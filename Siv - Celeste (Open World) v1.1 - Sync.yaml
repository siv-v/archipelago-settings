name: SivCeleste

# Used to describe your yaml. Useful if you have multiple files.
description: Siv's Celeste (Open World) Template

game: Celeste (Open World)
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Celeste (Open World): 1.1.2 # Version of the world required for this yaml to work as expected.

Celeste (Open World):
  ################
  # Game Options #
  ################
  progression_balancing: normal
  accessibility: full
  death_link: false
  death_link_amnesty: 10
  death_link_receipt_style: restart_chapter
  trap_link: false

  # Developer Intended: The logic for a room only requires movement that the developers would expect a first-time player to know in that room
  # Vanilla Movement: The logic for a room could require any movement or tricks learned anywhere in the vanilla game
  # Assist Mode: The logic expects you to use invincibility, infinite dashes, and infinite stamina
  logic_difficulty: vanilla_movement

  ################
  # Goal Options #
  ################
  goal_area: the_summit_a
  lock_goal_area: false
  goal_area_checkpointsanity: false
  total_strawberries: 40
  strawberries_required_percentage: 80

  ####################
  # Location Options #
  ####################
  checkpointsanity: false
  binosanity: true
  keysanity: true
  gemsanity: true
  carsanity: false
  roomsanity: false

  include_goldens: false
  golden_amnesty: 1

  include_core: true
  include_farewell: empty_space
  include_b_sides: false
  include_c_sides: false

  ####################
  # Movement Options #
  ####################
  # None: Dashing is not shuffled
  # Unified: A single `Dash` item exists, which gives you all 8 directions of dash
  # Cardinal Loose: Dash items exist for the four cardinal directions (up, right, down, left) exist, and receiving one allows you to dash in the adjacent diagonal directions as well
  # Cardinal Restrictive: Dash items exist for the four cardinal directions exist, but you must receive both cardinal directions to be able to dash in the diagonal direction between them
  # Octal: Separate dash items exist for all 8 dash directions
  dash_shuffle: cardinal_restrictive

  # none, unified, or split (left/right)
  climb_shuffle: unified
  crouch_shuffle: true

  ################
  # Item Options #
  ################
  # None: There is one item per interactable, which allows its use everywhere
  # Per Level: There is one item per interactable for each level, which allows its use in any side of that level
  # Per Side: There is one item per interactable for each side, which allows its use in that side of any level
  # Per Level And Side: There is one item per interactable for each combination of level and side, which allows its use in that side of that level
  split_interactables: per_level_and_side

  ##################
  # Junk and Traps #
  ##################
  junk_fill_percentage: 30
  reduce_raspberries: true

  trap_fill_percentage: 0
  trap_expiration_action: deaths
  trap_expiration_amount: 3
  bald_trap_weight:
    # Likelihood of receiving a trap which makes Maddy bald
    none: 0
    low: 0
    medium: 50
    high: 0

  literature_trap_weight:
    # Likelihood of a receiving a trap which causes the player to read literature
    none: 0
    low: 0
    medium: 50
    high: 0

  stun_trap_weight:
    # Likelihood of a receiving a trap which briefly stuns Maddy
    none: 0
    low: 0
    medium: 50
    high: 0

  invisible_trap_weight:
    # Likelihood of a receiving a trap which turns Maddy invisible
    none: 0
    low: 0
    medium: 50
    high: 0

  fast_trap_weight:
    # Likelihood of a receiving a trap which increases the game speed
    none: 0
    low: 0
    medium: 50
    high: 0

  slow_trap_weight:
    # Likelihood of a receiving a trap which decreases the game speed
    none: 0
    low: 0
    medium: 50
    high: 0

  ice_trap_weight:
    # Likelihood of a receiving a trap which causes the level to become slippery
    none: 0
    low: 0
    medium: 50
    high: 0

  reverse_trap_weight:
    # Likelihood of a receiving a trap which causes the controls to be reversed
    none: 0
    low: 0
    medium: 50
    high: 0

  screen_flip_trap_weight:
    # Likelihood of a receiving a trap which causes the screen to be flipped
    none: 0
    low: 0
    medium: 50
    high: 0

  laughter_trap_weight:
    # Likelihood of a receiving a trap which causes Maddy to laugh uncontrollably
    none: 0
    low: 0
    medium: 50
    high: 0

  hiccup_trap_weight:
    # Likelihood of a receiving a trap which causes Maddy to hiccup uncontrollably
    none: 0
    low: 0
    medium: 50
    high: 0

  zoom_trap_weight:
    # Likelihood of a receiving a trap which causes the camera to focus on Maddy
    none: 0
    low: 0
    medium: 50
    high: 0

  tiny_trap_weight:
    # Likelihood of a receiving a trap which causes Maddy to be Tiny
    none: 0
    low: 0
    medium: 50
    high: 0

  #####################
  # Aesthetic Options #
  #####################
  music_shuffle: none
  require_cassettes: false
  torch_behavior: vanilla
  madeline_hair_length: random
  madeline_one_dash_hair_color: any_color
  madeline_two_dash_hair_color: any_color
  madeline_no_dash_hair_color: any_color
  madeline_feather_hair_color: any_color

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
  # Forces these items to be in their native world.
  - Blue Torches
  - Yellow Torches
  - Mirror Temple - Blue Torches
  - Mirror Temple - Yellow Torches
  - Mirror Temple A - Blue Torches
  - Mirror Temple A - Yellow Torches
  - Mirror Temple B - Blue Torches
  - Strawberry

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: "Bomb: 1"
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
