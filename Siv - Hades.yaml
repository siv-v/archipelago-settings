name: SivHades

# Used to describe your yaml. Useful if you have multiple files.
description: Siv's Hades template.

game: Hades
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.

Hades:
  accessibility: full
  progression_balancing: normal

  ################
  # Game Options #
  ################
  initial_weapon: random
  location_system: room_weapon_based

  score_rewards_amount: 100

  keepsakesanity: true
  weaponsanity: true
  hidden_aspectsanity: true
  storesanity: true
  fatesanity: true
  death_link: false

  ################
  # Goal Options #
  ################
  hades_defeats_needed: 6
  weapons_clears_needed: random-range-4-6
  keepsakes_needed: 0
  fates_needed: 0

  ################
  # Heat Options #
  ################
  heat_system: reverse_heat

  hard_labor_pact_amount: 3
  lasting_consequences_pact_amount: 3
  convenience_fee_pact_amount: 2
  jury_summons_pact_amount: 3
  extreme_measures_pact_amount: 3
  calisthenics_program_pact_amount: 2
  benefits_package_pact_amount: 2
  middle_management_pact_amount: 0
  underworld_customs_pact_amount: 1
  forced_overtime_pact_amount: 2
  heightened_security_pact_amount: 1
  routine_inspection_pact_amount: 2
  damage_control_pact_amount: 2
  approval_process_pact_amount: 1
  tight_deadline_pact_amount: 1
  personal_liability_pact_amount: 0

  ##################
  # Filler Options #
  ##################
  darkness_pack_value: 300
  darkness_pack_percentage: 20
  keys_pack_value: 5
  keys_pack_percentage: 10
  gemstones_pack_value: 80
  gemstones_pack_percentage: 10
  diamonds_pack_value: 3
  diamonds_pack_percentage: 10
  titan_blood_pack_value: 3
  titan_blood_pack_percentage: 15
  nectar_pack_value: 5
  nectar_pack_percentage: 10
  ambrosia_pack_value: 2
  ambrosia_pack_percentage: 10

  ############################
  # Helpers and Trap Options #
  ############################
  filler_helper_percentage: 15
  max_health_helper_percentage: 50
  initial_money_helper_percentage: 50
  filler_trap_percentage: 0

  ###########################
  # Quality of Life Options #
  ###########################
  reverse_order_em: false
  ignore_greece_deaths: true
  store_give_hints: true
  disable_late_styx: true
  automatic_rooms_finish_on_hades_defeat: true

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: "Bomb: 1"
    {}

  start_inventory_from_pool:
    # Start with the specified amount of these items and don't place them in the world. Example: "Bomb: 1"
    # 
    # The game decides what the replacement items will be.
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
