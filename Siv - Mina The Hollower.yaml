name: SivMina

# Used to describe your yaml. Useful if you have multiple files.
description: Siv's Mina The Hollower Template

game: Mina The Hollower
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Mina The Hollower: 0.11.0 # Version of the world required for this yaml to work as expected.

Mina The Hollower:
  ################
  # Game Options #
  ################
  progression_balancing: normal
  accessibility: full

  ##############
  # AP Options #
  ##############
  goal: fixgenerators

  bone_up_cap: allupgrade

  goal_generators: 4
  max_stat_level: 15
  ossex_start: true
  kear_rando: apitems
  random_starting_items: false

  ability_rando:
    # Randomize abilities (You will not be able to perform the listed actions until sent them as items). You will always start in Ossex.
    # 
    # Valid Options:
    # - **Burrow** - The ability to burrow. You will still be able to enter Underlabs.
    # - **Swim** - The ability to swim (burrow in deep water).
    # - **Climb** - The ability to climb ropes.
    # - **Bounce** - The ability to bounce on bounce plants and springboards.
    # - **Spring** - The ability to be launched by springboards.
    # - **Carry** - The ability to carry objects.
    - Swim
    - Climb
    - Bounce
    - Spring
    - Carry

  death_link: false

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: "Bomb: 1"
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
